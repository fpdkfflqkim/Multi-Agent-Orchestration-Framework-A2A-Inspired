[project]
name = "multi-agent-orchestration-framework-a2a-inspired"
version = "0.1.0"
description = "LLM-driven multi-agent orchestration framework that dynamically plans execution DAGs, routes tasks across specialized agents, and iteratively refines answers via evaluation feedback."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "fastmcp>=3.2.3",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-classic>=1.0.3",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-neo4j>=0.9.0",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.2.0",
    "mcp-yahoo-finance>=0.1.3",
    "pymupdf4llm>=1.27.2.2",
    "uvicorn>=0.44.0",
]
